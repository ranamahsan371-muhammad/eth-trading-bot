name: Vortex Snipper 24/7 Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Trading Bot Script
        run: node bot.js

      - name: Commit and Push State Changes
        run: |
          git config --global user.name "Vortex Bot Automation"
          git config --global user.email "bot@users.noreply.github.com"
          git add bot_state.json || true
          git commit -m "Auto-update bot trade state [skip ci]" || true
          git push || true
